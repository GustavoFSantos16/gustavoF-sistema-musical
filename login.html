<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema Musical</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100
100%27><text y=%27.9em%27 font-size=%2790%27>🎵</text></svg>">
    <link rel="stylesheet" href="styles.css">
</head>

<body class="login-page">
    <div class="login-card">
        <div class="login-header">
            <h1>🎵 Sistema Musical</h1>
            <p>Entre com suas credenciais</p>
        </div>
        <form action="#" method="post">
            <div class="form-grup">
                <label for="usuario">Usuário</label>
                <input type="text" 
                name="usuario" 
                id="usuario" 
                required 
                autocomplete="username"
                placeholder="Seu usuário">

            </div>
            <div class="form-grup">
                <label for="senha">Senha</label>
                <input type="password" 
                name="senha" 
                id="senha" 
                required 
                autocomplete="current-password"
                placeholder="Sua senha">

            </div>
            <button type="submit" class="btn-primary">Entrar</button>
        </form>
        <div class="login-hint">
            <strong>Credenciais de teste:</strong><br>
            Usuário: <code>admin</code> &nbsp;·&nbsp; Senha: <code>123</code>
        </div>
    </div>

</body>

</html>
